name: Docker Image CI/CD for timescale + postgis image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile.*"
      - "init-ssl.sh"
      - "wrapper.sh"
      - ".github/workflows/build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: "Dockerfile.pg13-ts2.15"
          - dockerfile: "Dockerfile.pg14-ts2.19"
          - dockerfile: "Dockerfile.pg15-ts2.28"
          - dockerfile: "Dockerfile.pg16-ts2.29"
          - dockerfile: "Dockerfile.pg17-ts2.29"
          - dockerfile: "Dockerfile.pg18-ts2.28"
          - dockerfile: "Dockerfile.pg18-ts2.29"
          # Alpine + musl with the extensions compiled in: its own package, since
          # the tag says which PostgreSQL and TimescaleDB an image carries and
          # nothing about which libc built it
          - dockerfile: "Dockerfile.alpine-pg18-ts2.29"
            image: "timescaledb-alpine"
            tag: "pg18-ts2.29"
            flavour: "alpine"

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image reference
        id: image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE: ${{ matrix.image }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          # The Dockerfile name carries the tag, and the package name defaults to
          # the repository, so a line that ships something else than the base
          # pgMAJOR-tsLINE image states both in the matrix instead.
          tag="${TAG:-${DOCKERFILE#Dockerfile.}}"
          name="${IMAGE:-${GITHUB_REPOSITORY#*/}}"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/${name}:${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.image.outputs.ref }}

      - name: Smoke test
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          VERSION: ${{ steps.image.outputs.version }}
          FLAVOUR: ${{ matrix.flavour || 'ha' }}
        run: |
          set -euo pipefail

          expected_pg="${VERSION%%-*}"; expected_pg="${expected_pg#pg}"
          expected_ts="${VERSION#*-ts}"

          docker network create smokenet

          # pg_textsearch registers its access method from shared_preload_libraries, so
          # the alpine line is started the way the planner starts it. The HA line keeps
          # its own command: wrapper.sh pins the port and runs init-ssl.sh.
          command=()
          if [ "$FLAVOUR" = alpine ]; then
            command=(postgres -c shared_preload_libraries=timescaledb,pg_textsearch)
          fi

          # PGDATA is mandatory: wrapper.sh exits 1 without it. Same path Railway mounts,
          # so init-ssl.sh writes its certs beside the data directory as it does in prod.
          docker run -d --name smoke --network smokenet --network-alias postgres \
            -e POSTGRES_PASSWORD=smoke \
            -e PGDATA=/var/lib/postgresql/data/pgdata \
            "$IMAGE" "${command[@]}"

          # docker-entrypoint.sh runs initdb.d against a temporary server bound to the
          # unix socket only (listen_addresses=''), then shuts it down and starts the
          # real one. Polling TCP skips that phase; polling the socket races the
          # shutdown.
          for _ in $(seq 1 90); do
            docker exec smoke pg_isready -h 127.0.0.1 -U postgres -q 2>/dev/null && break
            sleep 2
          done
          docker exec smoke pg_isready -h 127.0.0.1 -U postgres

          q() { docker exec -e PGPASSWORD=smoke smoke psql -h 127.0.0.1 -U postgres -X -tAc "$1"; }

          actual_pg=$(q "select current_setting('server_version_num')::int / 10000")
          echo "postgres major: $actual_pg (expected $expected_pg)"
          test "$actual_pg" = "$expected_pg"

          # Proves the tag is not lying about what it ships, which is the failure this
          # workflow exists to catch: filename and base tag drifting apart.
          q "create extension if not exists timescaledb" >/dev/null
          actual_ts=$(q "select extversion from pg_extension where extname = 'timescaledb'")
          echo "timescaledb: $actual_ts (expected ${expected_ts}.x)"
          case "$actual_ts" in "${expected_ts}."*) ;; *) exit 1 ;; esac

          if [ "$FLAVOUR" = alpine ]; then
            # Both extensions are compiled against musl in this Dockerfile instead of
            # coming prebuilt with the base, so running them is the whole assertion.
            q "create extension if not exists timescaledb_toolkit" >/dev/null
            echo "timescaledb_toolkit: $(q "select extversion from pg_extension where extname = 'timescaledb_toolkit'")"
            test "$(q "select approx_percentile(0.5, percentile_agg(n)) > 0 from generate_series(1, 100) n")" = "t"

            q "create extension if not exists pg_textsearch" >/dev/null
            echo "pg_textsearch: $(q "select extversion from pg_extension where extname = 'pg_textsearch'")"
            q "create table bm25_probe (body text)" >/dev/null
            q "insert into bm25_probe values ('the quick brown fox'), ('lorem ipsum dolor')" >/dev/null
            q "create index on bm25_probe using bm25 (body) with (text_config = 'english')" >/dev/null
            test "$(q "select body from bm25_probe order by body <@> to_bm25query('fox', 'bm25_probe_body_idx') limit 1")" \
              = "the quick brown fox"
            echo "bm25 index ranks the matching row first"

            # TSL, not -oss: the planner's cache migrations compress chunks.
            q "create table tsl_probe (at timestamptz not null, value double precision)" >/dev/null
            q "select create_hypertable('tsl_probe', 'at')" >/dev/null
            q "insert into tsl_probe select now() - (g || ' minutes')::interval, g from generate_series(1, 100) g" >/dev/null
            q "alter table tsl_probe set (timescaledb.compress)" >/dev/null
            q "select compress_chunk(c) from show_chunks('tsl_probe') c" >/dev/null
            echo "TSL build: chunk compression works"
          else
            q "create extension if not exists postgis" >/dev/null
            echo "postgis: $(q "select extversion from pg_extension where extname = 'postgis'")"

            q "create extension if not exists pgfincore" >/dev/null
            q "create table fincore_probe as select generate_series(1, 100000) as n" >/dev/null
            # DONTNEED leaves dirty pages alone, so the freshly written table is flushed first
            q "checkpoint" >/dev/null
            test "$(q "select rel_os_pages > 0 and pages_mem > 0 from pgfincore('fincore_probe')")" = "t"
            q "select pgfadvise_dontneed('fincore_probe')" >/dev/null
            test "$(q "select pages_mem from pgfincore('fincore_probe')")" = "0"
            echo "pgfincore: $(q "select extversion from pg_extension where extname = 'pgfincore'"), eviction works"

            test "$(q "show ssl")" = "on"
            docker exec smoke test -f /var/lib/postgresql/data/certs/server.crt
            docker exec smoke openssl x509 -noout -checkend 0 \
              -in /var/lib/postgresql/data/certs/server.crt
            echo "ssl on, certificate present and unexpired"
          fi

      - name: PgBouncer round-trip
        run: |
          set -euo pipefail

          # Directus reaches PostgreSQL only through this pooler, so a version it
          # mishandles is an outage no test of the server alone would catch.
          docker run -d --name pgbouncer --network smokenet \
            -e DB_HOST=postgres \
            -e DB_PORT=5432 \
            -e DB_USER=postgres \
            -e DB_PASSWORD=smoke \
            -e AUTH_TYPE=scram-sha-256 \
            -e POOL_MODE=transaction \
            -e LISTEN_PORT=6432 \
            edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340

          # The client runs inside the already-started server container: this image's
          # entrypoint is wrapper.sh, so using it standalone tries to boot a server.
          for _ in $(seq 1 60); do
            docker exec smoke pg_isready -h pgbouncer -p 6432 -U postgres -q 2>/dev/null && break
            sleep 2
          done

          pooled() {
            docker exec -e PGPASSWORD=smoke smoke \
              psql -h pgbouncer -p 6432 -U postgres -d postgres -X -tAc "$1"
          }
          echo "through pgbouncer: $(pooled "select version()" | cut -c1-40)"
          test "$(pooled "select 1 + 1")" = "2"
          echo "pooled round-trip ok"

      - name: Pooled search_path handover
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          set -euo pipefail

          expected_pg="${VERSION%%-*}"; expected_pg="${expected_pg#pg}"

          # track_extra_parameters has no environment variable in this image, hence a
          # written-out config rather than a generated one.
          poolerConfigDir="$RUNNER_TEMP/pgbouncer-tracked"
          mkdir -p "$poolerConfigDir"
          cat >"$poolerConfigDir/pgbouncer.ini" <<'INI'
          [databases]
          postgres = host=postgres port=5432 dbname=postgres

          [pgbouncer]
          listen_addr = 0.0.0.0
          listen_port = 6432
          auth_file = /etc/pgbouncer/userlist.txt
          auth_type = scram-sha-256
          pool_mode = transaction
          default_pool_size = 1
          max_client_conn = 100
          ignore_startup_parameters = extra_float_digits
          track_extra_parameters = IntervalStyle,search_path
          admin_users = postgres
          INI
          # pgbouncer rejects the leading whitespace this heredoc needs to stay readable.
          awk '{ sub(/^ +/, ""); print }' "$poolerConfigDir/pgbouncer.ini" >"$poolerConfigDir/ini.trimmed"
          mv "$poolerConfigDir/ini.trimmed" "$poolerConfigDir/pgbouncer.ini"

          # PgBouncer runs SCRAM against the server itself, so the plaintext password is
          # what belongs here, exactly as this image's own entrypoint writes it.
          printf '"postgres" "smoke"\n' >"$poolerConfigDir/userlist.txt"
          chmod 0644 "$poolerConfigDir"/*

          docker run -d --name pgbouncer-tracked --network smokenet \
            -v "$poolerConfigDir/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro" \
            -v "$poolerConfigDir/userlist.txt:/etc/pgbouncer/userlist.txt:ro" \
            edoburu/pgbouncer:v1.25.2-p0@sha256:7d7a27d9e90985cab5cf42256f5c13a3120baa4b055b69df37beb272b89b2340

          for _ in $(seq 1 60); do
            docker exec smoke pg_isready -h pgbouncer-tracked -p 6432 -U postgres -q 2>/dev/null && break
            sleep 2
          done

          # Keeps only the last statement's result, so a leading SET command tag does not
          # end up in the compared value.
          tracked() {
            docker exec -e PGPASSWORD=smoke smoke \
              psql -h pgbouncer-tracked -p 6432 -U postgres -d postgres -X -tAc "$1" \
              | awk 'END { print }'
          }
          tracked "create schema if not exists pooled_isolation" >/dev/null

          # Guards the handover assertion against a server that ignored the SET entirely.
          witness=$(tracked "set search_path to pooled_isolation; select current_schema()")
          echo "same connection: $witness"
          test "$witness" = "pooled_isolation"

          # Separate psql invocation, so a separate client: in transaction pooling the
          # server is released in between, carrying whatever the first client left on it.
          tracked "set search_path to pooled_isolation" >/dev/null
          handover=$(tracked "select current_schema()")
          echo "next client on the same server connection: $handover"

          # PG18 marks search_path GUC_REPORT (28a1121f) so the pooler can restore it;
          # earlier majors never report it and the value leaks across clients.
          if [ "$expected_pg" -ge 18 ]; then
            test "$handover" = "public"
            echo "search_path restored between clients"
          else
            test "$handover" = "pooled_isolation"
            echo "search_path leaks between clients, as expected before PG18"
          fi

      - name: pg_textsearch regression suite
        if: matrix.flavour == 'alpine'
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail

          # The 70 tests pg_textsearch ships, run over the network against the image
          # this job built, so they exercise the musl build it publishes rather than
          # a build made for the occasion. The sources and pg_regress are already in
          # the `textsearch` stage; --load is what puts it in the docker image store.
          docker build --load --target textsearch -f "$DOCKERFILE" -t textsearch-tests .

          # Each test file creates the extension itself, and `abort` fails when it is
          # already there, so the database is handed over empty.
          docker exec -e PGPASSWORD=smoke smoke psql -h 127.0.0.1 -U postgres -X -q \
            -c 'create database contrib_regression'

          cat >"$RUNNER_TEMP/regress.sh" <<'SH'
          set -eu
          cd /src
          # `coverage` expects an unlimited ORDER BY through a bm25 index to return
          # every row of the table and gets one back. The glibc build of 1.3.0 in
          # timescaledb-ha fails it identically, so the expected file is upstream's
          # problem and not this image's.
          tests=$(sed -n 's/^REGRESS = //p' Makefile | tr ' ' '\n' | grep -vx coverage)
          if ! /usr/local/lib/postgresql/pgxs/src/test/regress/pg_regress \
            --use-existing --host=postgres --port=5432 --user=postgres \
            --dbname=contrib_regression --inputdir=test --outputdir=test $tests
          then
            cat test/regression.diffs
            exit 1
          fi
          SH
          docker run --rm --network smokenet -e PGPASSWORD=smoke \
            -v "$RUNNER_TEMP/regress.sh:/regress.sh:ro" textsearch-tests sh /regress.sh

      - name: timescaledb_toolkit doc examples
        if: matrix.flavour == 'alpine'
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail

          # sql-doctester runs every SQL example in the toolkit's own docs and diffs
          # the output. That is the check a musl build needs most: those examples are
          # the approximation aggregates, printed to 14 decimals.
          docker build --load --target toolkit-tests -f "$DOCKERFILE" -t toolkit-tests .

          # It creates a database per doc file and runs CREATE EXTENSION itself, so
          # the extension template1 arrives with has to go first.
          docker exec -e PGPASSWORD=smoke smoke psql -h 127.0.0.1 -U postgres -X -q \
            -d template1 -c 'drop extension timescaledb'

          # asap_smooth returns different bucket timestamps than its doc prints, with
          # the values matching to the last decimal, and the glibc build of 1.25.0 in
          # timescaledb-ha does the same, so that one file is left out.
          docker run --rm --network smokenet toolkit-tests sh -euc '
          mkdir /docs && cp /src/docs/*.md /docs && rm /docs/asap.md
          /src/target/release/sql-doctester -h postgres -p 5432 -u postgres \
            -a smoke -d postgres /docs
          '

      # Skipped for the alpine line: it drops the TimescaleDB upgrade scripts and
      # ships an unversioned toolkit library, so it can only ever initialise an
      # empty PGDATA — which is all a CI database is.
      - name: Resolve the previous release in this line
        id: prev
        if: matrix.flavour != 'alpine'
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          current=$(awk -F: 'NR==1 {print $2}' "$DOCKERFILE")
          echo "current base: $current"
          prev=$(CURRENT="$current" python3 - <<'PY'
          import json, os, re, urllib.request

          current = os.environ["CURRENT"]
          m = re.match(r"^pg(\d+)\.(\d+)-ts(\d+\.\d+)\.(\d+)$", current)
          if not m:
              print(""); raise SystemExit
          pg_major, pg_minor, ts_line, ts_patch = m[1], int(m[2]), m[3], int(m[4])

          pattern = re.compile(rf"^pg{pg_major}\.(\d+)-ts{re.escape(ts_line)}\.(\d+)$")
          url = ("https://hub.docker.com/v2/repositories/timescale/timescaledb-ha/tags"
                 f"?page_size=100&name=pg{pg_major}.")
          found = []
          for _ in range(3):
              if not url:
                  break
              with urllib.request.urlopen(url, timeout=30) as r:
                  page = json.load(r)
              for row in page.get("results", []):
                  hit = pattern.match(row["name"])
                  if hit and (int(hit[1]), int(hit[2])) < (pg_minor, ts_patch):
                      found.append(((int(hit[1]), int(hit[2])), row["name"]))
              url = page.get("next")
          print(max(found)[1] if found else "")
          PY
          )
          if [ -z "$prev" ]; then
            echo "no earlier release in this line — upgrade test skipped for $current"
          else
            echo "previous base: $prev"
          fi
          echo "tag=${prev}" >> "$GITHUB_OUTPUT"

      - name: Upgrade test
        if: steps.prev.outputs.tag != ''
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          PREV: ${{ steps.prev.outputs.tag }}
        run: |
          set -euo pipefail

          # The smoke test only ever initialises an empty PGDATA; a version bump asks
          # instead whether the new image adopts a data directory the old one created.
          awk -v prev="$PREV" 'NR==1 {print "FROM timescale/timescaledb-ha:" prev; next} {print}' \
            "$DOCKERFILE" > Dockerfile.previous
          docker build -f Dockerfile.previous -t previous:test .

          docker volume create pgupgrade
          docker run --rm --user root -v pgupgrade:/var/lib/postgresql/data previous:test \
            chown -R postgres:postgres /var/lib/postgresql/data

          run_pg() {
            docker run -d --name "$1" --network smokenet \
              -v pgupgrade:/var/lib/postgresql/data \
              -e POSTGRES_PASSWORD=smoke \
              -e PGDATA=/var/lib/postgresql/data/pgdata \
              "$2"
            for _ in $(seq 1 90); do
              docker exec "$1" pg_isready -h 127.0.0.1 -U postgres -q 2>/dev/null && return 0
              sleep 2
            done
            docker logs "$1"
            return 1
          }
          on() { docker exec -e PGPASSWORD=smoke "$1" psql -h 127.0.0.1 -U postgres -X -tAc "$2"; }

          run_pg old previous:test
          glibc_of() { docker exec "$1" ldd --version | awk 'NR==1 {print $NF}'; }
          old_glibc=$(glibc_of old)
          echo "seeded on $(on old "select current_setting('server_version')") / glibc $old_glibc"
          on old "create extension if not exists timescaledb" >/dev/null
          on old "create table readings (at timestamptz not null, value double precision)" >/dev/null
          on old "select create_hypertable('readings', 'at')" >/dev/null
          on old "insert into readings select now() - (g || ' minutes')::interval, g from generate_series(1, 5000) g" >/dev/null
          seeded=$(on old "select count(*) from readings")
          echo "seeded rows: $seeded"
          docker stop -t 60 old >/dev/null && docker rm old >/dev/null

          run_pg new "$IMAGE"
          new_glibc=$(glibc_of new)
          echo "upgraded to $(on new "select current_setting('server_version')") / glibc $new_glibc"

          # Must hold: the new binary adopts the old data directory intact.
          test "$(on new "select count(*) from readings")" = "$seeded"
          echo "row count preserved: $seeded"

          # glibc owns libc collation order, and pg_upgrade-style adoption keeps indexes
          # byte for byte — a changed sort order corrupts them silently, so refuse it.
          if [ "$old_glibc" != "$new_glibc" ]; then
            echo "glibc moved $old_glibc -> $new_glibc: text index collation may have changed."
            echo "This bump needs a REINDEX and must not land unattended."
            exit 1
          fi
          echo "glibc unchanged at $new_glibc, collation order stable"

          # Reported, not enforced: a catalog/library disagreement decides automerge safety.
          if on new "select count(*) from timescaledb_information.hypertables" >/dev/null 2>&1; then
            echo "AUTOMERGE-SIGNAL: timescaledb usable after upgrade with no ALTER EXTENSION"
          else
            echo "AUTOMERGE-SIGNAL: timescaledb unusable until ALTER EXTENSION — keep ts bumps manual"
            on new "alter extension timescaledb update" >/dev/null 2>&1 \
              && echo "  ALTER EXTENSION timescaledb UPDATE resolved it"
          fi

      - name: Container logs
        if: failure()
        run: |
          for c in smoke pgbouncer pgbouncer-tracked old new; do
            docker logs "$c" 2>&1 | tail -60 | awk -v c="$c" '{print "[" c "] " $0}' || true
          done

      - name: Publish
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.image.outputs.ref }}"
