name: Docker Image CI/CD for timescale + postgis image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Dockerfile.*"
      - "init-ssl.sh"
      - "wrapper.sh"
      - ".github/workflows/build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    strategy:
      matrix:
        dockerfile:
          [
            "Dockerfile.pg13-ts2.15",
            "Dockerfile.pg14-ts2.19",
            "Dockerfile.pg15-ts2.28",
            "Dockerfile.pg16-ts2.29",
            "Dockerfile.pg17-ts2.29",
            "Dockerfile.pg18-ts2.28",
            "Dockerfile.pg18-ts2.29",
          ]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from Dockerfile name
        id: extract_version
        run: |
          version="${{ matrix.dockerfile }}"
          version="${version#Dockerfile.}" # Remove "Dockerfile." prefix if it exists
          echo "version=${version}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build and Publish
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          # A pull request builds to prove the Dockerfile resolves, and stops short of
          # overwriting a published tag with an unreviewed branch.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.extract_version.outputs.version }}
